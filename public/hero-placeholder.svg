<svg width="600" height="900" viewBox="0 0 600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1A1D"/>
      <stop offset="50%" stop-color="#2A2A2D"/>
      <stop offset="100%" stop-color="#1A1A1D"/>
    </linearGradient>
    <linearGradient id="pinkGlow" x1="300" y1="0" x2="300" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF007F" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FF007F" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FF007F" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="600" height="900" fill="url(#bgGradient)"/>
  
  <!-- Decorative Circles -->
  <circle cx="100" cy="150" r="150" fill="url(#goldGlow)"/>
  <circle cx="500" cy="750" r="180" fill="url(#goldGlow)"/>
  
  <!-- Pink Accent Lines -->
  <path d="M0 300 Q150 250 300 300 T600 300" stroke="#FF007F" stroke-width="2" opacity="0.3" fill="none"/>
  <path d="M0 600 Q150 550 300 600 T600 600" stroke="#FF007F" stroke-width="2" opacity="0.3" fill="none"/>
  
  <!-- Center Design -->
  <g transform="translate(300, 450)">
    <!-- Gold Ring -->
    <circle cx="0" cy="0" r="120" stroke="#D4AF37" stroke-width="3" fill="none" opacity="0.6"/>
    <circle cx="0" cy="0" r="100" stroke="#D4AF37" stroke-width="1" fill="none" opacity="0.4"/>
    
    <!-- Pink Accent Circle -->
    <circle cx="0" cy="0" r="80" fill="#FF007F" opacity="0.15"/>
    
    <!-- Lingerie Icon -->
    <g transform="translate(-40, -40)">
      <!-- Bra Shape -->
      <path d="M20 30 Q30 20 40 30 Q50 20 60 30" stroke="#FF007F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="30" cy="35" r="12" stroke="#FF007F" stroke-width="2" fill="none"/>
      <circle cx="50" cy="35" r="12" stroke="#FF007F" stroke-width="2" fill="none"/>
      <line x1="18" y1="35" x2="10" y2="40" stroke="#D4AF37" stroke-width="1.5"/>
      <line x1="62" y1="35" x2="70" y2="40" stroke="#D4AF37" stroke-width="1.5"/>
    </g>
  </g>
  
  <!-- Sparkle Elements -->
  <g opacity="0.6">
    <path d="M150 200 L152 206 L158 208 L152 210 L150 216 L148 210 L142 208 L148 206 Z" fill="#D4AF37"/>
    <path d="M450 250 L452 256 L458 258 L452 260 L450 266 L448 260 L442 258 L448 256 Z" fill="#D4AF37"/>
    <path d="M500 500 L502 506 L508 508 L502 510 L500 516 L498 510 L492 508 L498 506 Z" fill="#FF007F"/>
    <path d="M100 650 L102 656 L108 658 L102 660 L100 666 L98 660 L92 658 L98 656 Z" fill="#FF007F"/>
  </g>
  
  <!-- Bottom Text -->
  <g transform="translate(300, 780)">
    <text x="0" y="0" font-family="serif" font-size="32" font-weight="700" text-anchor="middle" fill="#FFFFFF">
      Night × Lace
    </text>
    <text x="0" y="30" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#D4AF37" letter-spacing="2">
      PREMIUM LINGERIE
    </text>
    <line x1="-80" y1="50" x2="80" y2="50" stroke="#FF007F" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- Corner Accents -->
  <path d="M0 0 L50 0 L50 2 L2 2 L2 50 L0 50 Z" fill="#D4AF37" opacity="0.4"/>
  <path d="M600 0 L550 0 L550 2 L598 2 L598 50 L600 50 Z" fill="#D4AF37" opacity="0.4"/>
  <path d="M0 900 L50 900 L50 898 L2 898 L2 850 L0 850 Z" fill="#FF007F" opacity="0.4"/>
  <path d="M600 900 L550 900 L550 898 L598 898 L598 850 L600 850 Z" fill="#FF007F" opacity="0.4"/>
</svg>
